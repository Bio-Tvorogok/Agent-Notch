name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Checks
        run: ./scripts/test.sh
      - name: Package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package.sh "${GITHUB_REF_NAME}"
      - name: Release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 {on=1; next} on && /^## / {exit} on && !/^\[/' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
          cat packaging/install-notes.md >> dist/notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --title "Agent Notch $v" --notes-file dist/notes.md \
            "dist/AgentNotch-$v.dmg" "dist/AgentNotch-$v.zip" dist/SHA256SUMS.txt assets/agent-notch-promo.mp4
      - name: Check tap token
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then echo "has=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::TAP_TOKEN is not set: update Forichok/homebrew-tap by hand"; fi
      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        if: steps.tap.outputs.has == '1'
        run: |
          v="${GITHUB_REF_NAME#v}"
          sha=$(shasum -a 256 "dist/AgentNotch-$v.zip" | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Forichok/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/__VERSION__/$v/" -e "s/__SHA256__/$sha/" packaging/agent-notch.rb > tap/Casks/agent-notch.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/agent-notch.rb
          git diff --cached --quiet || { git commit -m "agent-notch $v" && git push; }
