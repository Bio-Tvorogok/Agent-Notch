name: Bug report
description: Something looks wrong in the wing or the list
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw and what you expected instead. A screenshot helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: "1. Start Claude Code in …\n2. …"
  - type: input
    id: version
    attributes:
      label: Agent Notch version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.6, MacBook Pro 14\" M3"
  - type: input
    id: agents
    attributes:
      label: Claude Code / Codex versions
      placeholder: "claude 2.3.1, codex 0.60.0"
